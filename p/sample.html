const initial={customer:'기업 고객사',intro:'축하와 감사, 위로가 필요한 순간. 정성스럽게 고른 꽃과 기업고객 전용 혜택을 만나보세요.',email:'contact@bestflower.co.kr',channel:'베스트플라워 꽃배달',notices:[{title:'기업고객 주문 안내',body:'첨부 주문서에 배송 정보를 작성한 뒤 카카오톡 채널 또는 이메일로 전달해 주세요. 상품 선택이 어려우시면 행사 목적과 예산을 함께 알려주세요.'},{title:'인사이동 시즌 배송 안내',body:'인사이동 시즌에는 주문 물량이 많아 요청하신 배송시간에 맞추기 어려울 수 있습니다. 일정은 주문 접수 시 확인해 주세요.'}],products:cats.map((c,i)=>({id:'sample-'+i,name:['정성을 담은 축하화환','공간을 채우는 그린 화분','감사의 마음 꽃바구니','기품 있는 서양란','오래 간직하는 옥꽃'][i],category:c,size:'실제 상품 크기를 입력해 주세요',description:['축하의 순간에 전하는 풍성한 마음','새로운 시작과 공간에 싱그러움을','기념일과 감사의 순간을 위한 꽃','소중한 분께 전하는 품격 있는 선물','시간이 지나도 간직할 특별한 선물'][i],regular:[100000,120000,80000,150000,200000][i],offer:[80000,96000,64000,120000,160000][i],notes:'등록 예시입니다. 실제 상품 사진·규격·가격으로 수정한 뒤 전달해 주세요.',image:'',deliveries:[],sample:true}))};
function validate(d){if(!d||typeof d.customer!=='string'||!Array.isArray(d.products)||!Array.isArray(d.notices)||d.products.length>200)throw Error('올바른 백업 파일이 아닙니다.');for(const p of d.products){if(!/^[a-zA-Z0-9-]+$/.test(p.id)||!cats.includes(p.category)||typeof p.name!=='string'||!Number.isFinite(p.regular)||!Number.isFinite(p.offer)||p.offer<0||p.regular<p.offer||!Array.isArray(p.deliveries)||p.deliveries.length>3)throw Error('상품 데이터 형식을 확인해 주세요.');if([p.image,...p.deliveries].some(x=>x&&!/^data:image\/(jpeg|png|webp);base64,/.test(x)))throw Error('지원하지 않는 사진 형식입니다.')}return d}
let data=snap||initial;try{if(!snap){let s=localStorage.getItem('bestflower-v1');if(s)data=validate(JSON.parse(s))}}catch(e){setTimeout(()=>toast('저장 데이터를 읽지 못해 기본 예시를 표시합니다.'),100)}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.add('hidden'),4000)}function save(d){try{localStorage.setItem('bestflower-v1',JSON.stringify(d));data=d;$('#saved').textContent='· 저장됨';return true}catch(e){toast('저장 공간이 부족합니다. 사진이나 상품 수를 줄인 뒤 다시 저장해 주세요.');return false}}const money=n=>Number(n).toLocaleString('ko-KR')+'원',discount=p=>p.regular?Math.round((1-p.offer/p.regular)*100):0;
function art(kind=2){let out='<svg viewBox="0 0 360 340" role="img" aria-label="꽃과 잎의 장식 일러스트"><ellipse cx="180" cy="311" rx="90" ry="9" fill="#24432210"/><path d="M180 275Q170 170 112 95M180 275Q225 180 243 102M180 275Q180 140 179 63M180 275Q115 195 77 168M180 275Q238 223 278 177" fill="none" stroke="#718769" stroke-width="3"/>';[[130,170,-40],[218,168,35],[160,207,-40],[237,215,45],[176,120,-15],[102,199,-50]].forEach(([x,y,r])=>out+=`<ellipse cx="${x}" cy="${y}" rx="13" ry="37" transform="rotate(${r} ${x} ${y})" fill="#84977b"/>`);if(kind===1)out+='<ellipse cx="180" cy="96" rx="27" ry="70" fill="#708768"/><ellipse cx="234" cy="142" rx="23" ry="65" transform="rotate(42 234 142)" fill="#8b9e7c"/>';else [[110,93,32],[179,65,36],[243,105,30],[78,166,24],[277,176,23],[167,143,27],[224,155,27]].forEach(([x,y,r],i)=>{for(let a=0;a<6;a++){let t=a*Math.PI/3;out+=`<ellipse cx="${x+Math.cos(t)*r*.43}" cy="${y+Math.sin(t)*r*.43}" rx="${r*.53}" ry="${r*.64}" transform="rotate(${a*60} ${x+Math.cos(t)*r*.43} ${y+Math.sin(t)*r*.43})" fill="${i%2?'#e4d5c2':'#faf6ec'}" stroke="#d5ccba" stroke-width=".6"/>`}out+=`<circle cx="${x}" cy="${y}" r="${r*.19}" fill="#bd9d65"/>`});return out+`<path d="M134 243H226L213 306Q180 318 147 306Z" fill="${kind===2?'#c7af91':'#d8d4c6'}"/><path d="M134 251H226" stroke="#aaa08e"/><path d="M169 247q-26-22-26-8t37 12q32-23 31-11t-31 11l-7 38m7-38 14 35" stroke="#eeeadf" stroke-width="4" fill="none"/></svg>`}
const pic=p=>p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`:art(cats.indexOf(p.category));const price=p=>`<div class="regular"><span>홈페이지 판매가</span><s>${money(p.regular)}</s></div><div class="price"><span>기업고객 제안가</span><strong>${money(p.offer)}</strong><em>${discount(p)}%</em></div>`;
function render(){const editing=!readonly&&!preview;$('#toolbar').classList.toggle('hidden',!editing);$('#previewBar').classList.toggle('hidden',!preview);$('#customer').textContent=data.customer;$('#particle').textContent=objectParticle(data.customer);$('#intro').textContent=data.intro;$('#count').textContent=String(data.products.length).padStart(2,'0');$('#contact').textContent=`주문 문의 · ${data.email} / 카카오톡 ${data.channel}`;document.title=`${data.customer} · 베스트플라워 상품 제안`;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='products')products();else if(tab==='notices')notices();else order()}
function products(){let filtered=data.products.filter(p=>(category==='전체'||p.category===category)&&(p.name+' '+p.description).toLowerCase().includes(query.toLowerCase()));$('#page').innerHTML=`<div class="section-head"><div><h2>마음을 전하는 컬렉션</h2><p class="sub">특별한 순간에 어울리는 상품을 만나보세요.</p></div><input id="search" class="search" placeholder="상품명으로 검색 ⌕" aria-label="상품 검색" value="${esc(query)}"></div><div class="filters">${['전체',...cats].map(c=>`<button data-cat="${esc(c)}" class="${category===c?'active':''}">${c}</button>`).join('')}</div><div class="grid">${filtered.map(p=>`<article class="card"><div class="photo">${pic(p)}${p.sample||!p.image?`<span class="badge">${p.sample?'등록 예시 · 실제 판매정보 아님':'상품 사진 준비 중'}</span>`:''}</div><div class="body"><span class="cat">${esc(p.category)}</span><h3>${esc(p.name)}</h3><p class="desc">${esc(p.description)}</p>${price(p)}<div class="card-actions"><button data-detail="${p.id}">상품 · 배송사진 보기 ↗</button>${!readonly&&!preview?`<button data-edit="${p.id}">수정</button>`:''}</div></div></article>`).join('')||'<div class="empty">해당하는 상품이 없습니다.</div>'}</div><div class="strip">${data.products.some(p=>p.sample)?'※ 등록 예시의 가격·규격·일러스트는 실제 판매정보가 아닙니다. 실제 정보로 수정 후 전달해 주세요.':'※ 꽃과 식물의 구성은 계절과 수급에 따라 달라질 수 있습니다. 상품별 참고사항을 확인해 주세요.'}</div>`;$('#search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;products();$('#search').focus();$('#search').setSelectionRange(pos,pos)};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;products()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit))}
function notices(){$('#page').innerHTML=`<div class="section-head"><div><h2>공지사항</h2><p class="sub">주문 전 확인하시면 좋은 안내입니다.</p></div></div>${data.notices.map((n,i)=>`<article class="panel"><span class="eyebrow">NOTICE ${String(i+1).padStart(2,'0')}</span><h3>${esc(n.title)}</h3><p class="preserve helper">${esc(n.body)}</p></article>`).join('')||'<div class="empty">등록된 공지가 없습니다.</div>'}`}
function legacyOrder(){$('#page').innerHTML=`<div class="section-head"><div><h2>엑셀로 간편하게, 대량주문</h2><p class="sub">첨부해 주신 베스트플라워 대량주문양식 기준 안내</p></div><button id="downloadOrder" class="primary">엑셀 주문양식 다운로드 ↓</button></div><div class="steps"><div class="step"><em>01</em><h3>주문서 내려받기</h3><p>엑셀 양식을 다운로드하고 예시 행을 확인해 주세요.</p></div><div class="step"><em>02</em><h3>배송 정보 작성하기</h3><p>배송 건별로 한 줄씩 작성하고 연락처와 리본문구를 확인해 주세요.</p></div><div class="step"><em>03</em><h3>작성한 파일 전달하기</h3><p>이메일 ${esc(data.email)} 또는 카카오톡 채널 ‘${esc(data.channel)}’로 전달해 주세요.</p></div></div><div class="panel"><h3>이렇게 작성해 주세요</h3><table>${[['상품명','선택하신 상품명 또는 행사 목적과 예산'],['배송희망 일자','원하시는 배송 날짜'],['배달장소','도로명 주소, 건물명, 층수 및 상세 장소'],['받으시는 분','수령인 성함'],['받으시는 분(연락처)','배송 시 연락 가능한 전화번호'],['문구(보내는 분)','회사명, 직함 및 보내는 분 성함'],['리본문구(경조사어)','축하 또는 위로의 문구']].map(([a,b])=>`<tr><th>${a}</th><td>${b}</td></tr>`).join('')}</table><p class="helper">순번은 배송 건별로 기입해 주세요. 샘플 행은 작성 예시이므로 실제 주문 내용과 구분해 주세요.</p></div><div class="panel"><h3>접수와 결제 안내</h3><p>무통장 입금 또는 카드결제가 가능합니다. 카드결제는 별도 안내를 받아 주세요.</p><p class="helper">인사이동 시즌에는 배송시간 조정이 필요할 수 있으니 접수 시 확인해 주세요. 이 페이지에서는 주문 파일을 자동 전송하지 않습니다.</p></div>`;$('#downloadOrder').onclick=excel}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').showModal()}function detail(id){let p=data.products.find(p=>p.id===id);modal(p.name,`<div class="detail"><div class="photo">${pic(p)}</div><div><span class="cat">${esc(p.category)}</span><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><p class="helper">크기 · ${esc(p.size)}</p>${price(p)}${p.sample?'<p class="helper">등록 예시 · 실제 판매정보 아님</p>':''}</div></div><h3 style="margin-top:25px">실제 배송사진</h3><div class="gallery">${[0,1,2].map(i=>p.deliveries[i]?`<button class="zoom-trigger" data-zoom="${i}" aria-label="배송사진 ${i+1} 확대"><img src="${esc(p.deliveries[i])}" alt="실제 배송사진 ${i+1}"><span>크게 보기 ⤢</span></button>`:'<div class="missing">배송사진 미등록</div>').join('')}</div><h3 style="margin-top:25px">참고사항</h3><p class="preserve helper">${esc(p.notes)||'별도 참고사항이 없습니다.'}</p>`);document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>openZoom(p.deliveries[Number(b.dataset.zoom)],p.name+' · 배송사진 '+(Number(b.dataset.zoom)+1)))}
function field(label,name,value,type='text'){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${['name','regular','offer','customer'].includes(name)?'required':''} ${type==='number'?'min="0" step="1"':''}></label>`}async function compress(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type))throw Error('JPG, PNG, WebP 사진을 선택해 주세요.');if(f.size>20*1024*1024)throw Error('사진은 장당 20MB 이하로 선택해 주세요.');let b=await createImageBitmap(f),c=document.createElement('canvas'),s=Math.min(1,1000/Math.max(b.width,b.height));c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);b.close();return c.toDataURL('image/jpeg',.8)}

function githubShare(){if(readonly||preview)return;let slug='';try{slug=localStorage.getItem(shareKey())||''}catch{}if(!slug)slug='proposal-'+crypto.randomUUID().replaceAll('-','').slice(0,16);modal('고객 링크 발행',`<form id="githubForm"><p><b>${esc(data.customer)}</b> 고객용 상품·사진·주문 안내를 GitHub Pages에 발행합니다.</p><p class="helper">발행한 링크는 로그인 없이 열 수 있으며 내용은 공개 저장소에 저장됩니다. 같은 주소로 다시 발행하면 고객은 기존 링크에서 수정본을 볼 수 있습니다.</p><div class="form-grid"><label class="field full">고객 링크 주소<input name="slug" required pattern="[a-z0-9][a-z0-9-]{2,79}" maxlength="80" value="${slug}"><small>${githubBase}p/입력한주소.html · 영문 소문자·숫자·하이픈</small></label><label class="field full">GitHub 발행 토큰<input name="token" type="password" autocomplete="off" spellcheck="false" placeholder="${githubToken?'현재 탭에 연결됨 · 교체할 때만 입력':'선택한 저장소의 Contents 쓰기 권한 토큰'}"><small>토큰은 현재 탭 메모리에서만 사용하며 백업·고객 파일·브라우저 저장소에 저장하지 않습니다.</small></label></div><details style="margin-top:15px"><summary>처음 연결하는 방법</summary><p class="helper">GitHub의 Settings → Developer settings → Personal access tokens → Fine-grained tokens에서 bestflower-proposals 저장소만 선택하고 Contents: Read and write 권한을 지정해 발급하세요. 발급한 토큰은 채팅에 보내지 말고 위 입력칸에 직접 붙여넣으세요. 새로고침 후에는 다시 입력해야 합니다.</p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">GitHub 토큰 설정 열기 ↗</a></details><div class="actions"><button type="button" id="disconnectGithub">연결 해제</button><button type="submit" class="primary" id="publishGithub">이 내용으로 링크 발행</button></div><p id="shareStatus" role="status" class="share-status helper"></p><div id="shareResult"></div></form>`);$('#disconnectGithub').onclick=()=>{githubToken='';$('#githubForm').elements.token.value='';$('#githubForm').elements.token.placeholder='선택한 저장소의 Contents 쓰기 권한 토큰';toast('현재 탭의 GitHub 연결 정보를 지웠습니다.')};$('#githubForm').onsubmit=publishGithub}
async function githubRequest(path,token,options={}){const r=await fetch('https://api.github.com/repos/'+githubRepo+path,{...options,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(options.body?{'Content-Type':'application/json'}:{})},signal:AbortSignal.timeout(45000)});if(r.status===404&&options.allowMissing)return null;if(!r.ok){const codes={401:'GitHub 토큰이 올바르지 않거나 만료되었습니다.',403:'저장소 Contents 쓰기 권한 또는 API 요청 한도를 확인해 주세요.',404:'저장소 접근 권한이나 GitHub Pages 설정을 확인해 주세요.',409:'다른 변경과 충돌했습니다. 내용을 확인한 뒤 다시 발행해 주세요.',422:'주소나 파일 크기, 저장소 설정을 확인해 주세요.'};throw Error(codes[r.status]||'GitHub 요청 실패 ('+r.status+'). 변경 여부를 저장소에서 확인해 주세요.')}return r.status===204?{}:r.json()}
async function publishGithub(e){e.preventDefault();let form=e.target,btn=$('#publishGithub'),status=$('#shareStatus'),slug=form.elements.slug.value.trim(),token=form.elements.token.value.trim()||githubToken;if(!/^[a-z0-9][a-z0-9-]{2,79}$/.test(slug))return toast('고객 링크 주소를 확인해 주세요.');if(!token)return toast('GitHub 발행 토큰을 입력해 주세요.');btn.disabled=true;status.textContent='GitHub 연결 및 기존 링크를 확인하고 있습니다…';$('#shareResult').innerHTML='';try{const path='/contents/p/'+slug+'.html';const old=await githubRequest(path+'?ref=main',token,{allowMissing:true});if(old&&!confirm('이 주소의 기존 제안서를 현재 내용으로 교체할까요?')){status.textContent='발행을 취소했습니다.';return}const html=customerHTML();if(new Blob([html]).size>20*1024*1024)throw Error('제안서가 20MB를 초과합니다. 사진 수나 크기를 줄여 주세요.');status.textContent='상품과 사진을 발행하고 있습니다. 창을 닫지 말아 주세요…';const payload={message:'Publish customer proposal',branch:'main',content:bytesBase64(new TextEncoder().encode(html)),...(old?{sha:old.sha}:{})};await githubRequest(path,token,{method:'PUT',body:JSON.stringify(payload)});githubToken=token;form.elements.token.value='';form.elements.token.placeholder='현재 탭에 연결됨';try{localStorage.setItem(shareKey(),slug)}catch{}const url=githubBase+'p/'+slug+'.html';status.textContent='GitHub에 저장했습니다. Pages 반영까지 잠시 걸릴 수 있습니다. 링크를 열어 내용이 표시되는지 확인한 후 전달하세요.';$('#shareResult').innerHTML=`<a class="result-link" href="${url}" target="_blank" rel="noopener noreferrer">${url}</a><button type="button" id="copyCustomerLink" style="margin-top:12px">고객 링크 복사</button>`;$('#copyCustomerLink').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('고객 링크를 복사했습니다.')}catch{toast('위 링크를 길게 누르거나 우클릭해 복사해 주세요.')}}}catch(err){status.textContent=err.name==='TimeoutError'||err.name==='TypeError'?'연결이 끊겼습니다. GitHub에 저장되었을 수 있으므로 저장소에서 반영 여부를 확인한 뒤 다시 시도해 주세요.':err.message}finally{btn.disabled=false}}
$('#shareGithub').onclick=githubShare;

$('#downloadTop').onclick=excel;$('#explore').onclick=()=>{tab='products';render();$('.tabs').scrollIntoView({behavior:'smooth'})};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#close').onclick=()=>$('#modal').close();$('#settings').onclick=settings;$('#add').onclick=()=>edit();$('#preview').onclick=()=>{preview=true;render()};$('#exitPreview').onclick=()=>{preview=false;render()};$('#export').onclick=exportCustomer;$('#backup').onclick=()=>download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'베스트플라워_편집백업.json');$('#restore').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>25*1024*1024)throw Error('백업 파일은 25MB 이하만 지원합니다.');let d=validate(JSON.parse(await f.text()));if(confirm('현재 내용을 백업 파일의 내용으로 교체할까요?')&&save(d)){render();toast('백업을 불러왔습니다.')}}catch(err){toast(err.message)}finally{e.target.value=''}};render();
</script></body></html>
