function validate(d){if(!d||typeof d.customer!=='string'||!Array.isArray(d.products)||!Array.isArray(d.notices)||d.products.length>200)throw Error('올바른 백업 파일이 아닙니다.');for(const p of d.products){if(!/^[a-zA-Z0-9-]+$/.test(p.id)||!cats.includes(p.category)||typeof p.name!=='string'||!Number.isFinite(p.regular)||!Number.isFinite(p.offer)||p.offer<0||p.regular<p.offer||!Array.isArray(p.deliveries)||p.deliveries.length>3)throw Error('상품 데이터 형식을 확인해 주세요.');if([p.image,...p.deliveries].some(x=>x&&!/^data:image\/(jpeg|png|webp);base64,/.test(x)))throw Error('지원하지 않는 사진 형식입니다.')}return d}

function products(){let filtered=data.products.filter(p=>(category==='전체'||p.category===category)&&(p.name+' '+p.description).toLowerCase().includes(query.toLowerCase()));$('#page').innerHTML=`<div class="section-head"><div><h2>마음을 전하는 컬렉션</h2><p class="sub">특별한 순간에 어울리는 상품을 만나보세요.</p></div><input id="search" class="search" placeholder="상품명으로 검색 ⌕" aria-label="상품 검색" value="${esc(query)}"></div><div class="filters">${['전체',...cats].map(c=>`<button data-cat="${esc(c)}" class="${category===c?'active':''}">${c}</button>`).join('')}</div><div class="grid">${filtered.map(p=>`<article class="card"><div class="photo">${pic(p)}${p.sample||!p.image?`<span class="badge">${p.sample?'등록 예시 · 실제 판매정보 아님':'상품 사진 준비 중'}</span>`:''}</div><div class="body"><span class="cat">${esc(p.category)}</span><h3>${esc(p.name)}</h3><p class="desc">${esc(p.description)}</p>${price(p)}<div class="card-actions"><button data-detail="${p.id}">상품 · 배송사진 보기 ↗</button>${!readonly&&!preview?`<button data-edit="${p.id}">수정</button>`:''}</div></div></article>`).join('')||'<div class="empty">해당하는 상품이 없습니다.</div>'}</div><div class="strip">${data.products.some(p=>p.sample)?'※ 등록 예시의 가격·규격·일러스트는 실제 판매정보가 아닙니다. 실제 정보로 수정 후 전달해 주세요.':'※ 꽃과 식물의 구성은 계절과 수급에 따라 달라질 수 있습니다. 상품별 참고사항을 확인해 주세요.'}</div>`;$('#search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;products();$('#search').focus();$('#search').setSelectionRange(pos,pos)};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;products()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit))}

function legacyOrder(){$('#page').innerHTML=`<div class="section-head"><div><h2>엑셀로 간편하게, 대량주문</h2><p class="sub">첨부해 주신 베스트플라워 대량주문양식 기준 안내</p></div><button id="downloadOrder" class="primary">엑셀 주문양식 다운로드 ↓</button></div><div class="steps"><div class="step"><em>01</em><h3>주문서 내려받기</h3><p>엑셀 양식을 다운로드하고 예시 행을 확인해 주세요.</p></div><div class="step"><em>02</em><h3>배송 정보 작성하기</h3><p>배송 건별로 한 줄씩 작성하고 연락처와 리본문구를 확인해 주세요.</p></div><div class="step"><em>03</em><h3>작성한 파일 전달하기</h3><p>이메일 ${esc(data.email)} 또는 카카오톡 채널 ‘${esc(data.channel)}’로 전달해 주세요.</p></div></div><div class="panel"><h3>이렇게 작성해 주세요</h3><table>${[['상품명','선택하신 상품명 또는 행사 목적과 예산'],['배송희망 일자','원하시는 배송 날짜'],['배달장소','도로명 주소, 건물명, 층수 및 상세 장소'],['받으시는 분','수령인 성함'],['받으시는 분(연락처)','배송 시 연락 가능한 전화번호'],['문구(보내는 분)','회사명, 직함 및 보내는 분 성함'],['리본문구(경조사어)','축하 또는 위로의 문구']].map(([a,b])=>`<tr><th>${a}</th><td>${b}</td></tr>`).join('')}</table><p class="helper">순번은 배송 건별로 기입해 주세요. 샘플 행은 작성 예시이므로 실제 주문 내용과 구분해 주세요.</p></div><div class="panel"><h3>접수와 결제 안내</h3><p>무통장 입금 또는 카드결제가 가능합니다. 카드결제는 별도 안내를 받아 주세요.</p><p class="helper">인사이동 시즌에는 배송시간 조정이 필요할 수 있으니 접수 시 확인해 주세요. 이 페이지에서는 주문 파일을 자동 전송하지 않습니다.</p></div>`;$('#downloadOrder').onclick=excel}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').showModal()}function detail(id){let p=data.products.find(p=>p.id===id);modal(p.name,`<div class="detail"><div class="photo">${pic(p)}</div><div><span class="cat">${esc(p.category)}</span><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><p class="helper">크기 · ${esc(p.size)}</p>${price(p)}${p.sample?'<p class="helper">등록 예시 · 실제 판매정보 아님</p>':''}</div></div><h3 style="margin-top:25px">실제 배송사진</h3><div class="gallery">${[0,1,2].map(i=>p.deliveries[i]?`<button class="zoom-trigger" data-zoom="${i}" aria-label="배송사진 ${i+1} 확대"><img src="${esc(p.deliveries[i])}" alt="실제 배송사진 ${i+1}"><span>크게 보기 ⤢</span></button>`:'<div class="missing">배송사진 미등록</div>').join('')}</div><h3 style="margin-top:25px">참고사항</h3><p class="preserve helper">${esc(p.notes)||'별도 참고사항이 없습니다.'}</p>`);document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>openZoom(p.deliveries[Number(b.dataset.zoom)],p.name+' · 배송사진 '+(Number(b.dataset.zoom)+1)))}
function field(label,name,value,type='text'){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${['name','regular','offer','customer'].includes(name)?'required':''} ${type==='number'?'min="0" step="1"':''}></label>`}async function compress(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type))throw Error('JPG, PNG, WebP 사진을 선택해 주세요.');if(f.size>20*1024*1024)throw Error('사진은 장당 20MB 이하로 선택해 주세요.');let b=await createImageBitmap(f),c=document.createElement('canvas'),s=Math.min(1,1000/Math.max(b.width,b.height));c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);b.close();return c.toDataURL('image/jpeg',.8)}
function edit(id){if(readonly||preview)return;let old=data.products.find(p=>p.id===id),p=old||{name:'',category:cats[0],size:'',description:'',regular:0,offer:0,notes:'',image:'',deliveries:[],sample:false};modal(old?'商品 수정'.replace('商品','상품'):'새 상품 등록',`<form id="productForm"><div class="form-grid">${field('상품명','name',p.name)}<label class="field">카테고리<select name="category">${cats.map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></label>${field('크기','size',p.size)}<label class="field">예시 상품 표시<select name="sample"><option value="false" ${!p.sample?'selected':''}>실제 판매상품</option><option value="true" ${p.sample?'selected':''}>등록 예시</option></select></label><label class="field full">간단한 설명<textarea name="description">${esc(p.description)}</textarea></label>${field('홈페이지 판매가 (원)','regular',p.regular,'number')}${field('기업고객 제안가 (원)','offer',p.offer,'number')}<p class="helper full" id="discount"></p><label class="field">상품사진<input type="file" name="image" accept="image/jpeg,image/png,image/webp"><small>미선택 시 기존 사진 유지</small>${p.image?`<div class="thumbs"><img src="${p.image}" alt="기존 상품사진"></div><span><input type="checkbox" name="removeImage" style="width:auto"> 기존 사진 삭제</span>`:''}</label><label class="field">실제 배송사진 (최대 3장)<input type="file" name="deliveries" accept="image/jpeg,image/png,image/webp" multiple><small>선택하면 기존 배송사진 전체 교체</small>${p.deliveries.length?`<div class="thumbs">${p.deliveries.map(x=>`<img src="${x}" alt="기존 배송사진">`).join('')}</div><span><input type="checkbox" name="removeDeliveries" style="width:auto"> 기존 배송사진 삭제</span>`:''}</label><label class="field full">참고사항<textarea name="notes">${esc(p.notes)}</textarea></label></div><div class="actions">${old?'<button type="button" class="danger" id="delete">상품 삭제</button>':''}<button type="button" id="cancel">취소</button><button class="primary" type="submit" id="submit">상품 저장</button></div></form>`);let form=$('#productForm');function calc(){let a=Number(form.elements.regular.value),b=Number(form.elements.offer.value);$('#discount').textContent=a?`할인율 ${Math.round((1-b/a)*100)}% · 자동 계산`:'홈페이지 판매가를 입력하면 할인율을 계산합니다.'}form.elements.regular.oninput=calc;form.elements.offer.oninput=calc;calc();$('#cancel').onclick=()=>$('#modal').close();if(old)$('#delete').onclick=()=>{if(confirm('이 상품을 삭제할까요?')){let d=structuredClone(data);d.products=d.products.filter(x=>x.id!==id);if(save(d)){$('#modal').close();render();toast('상품을 삭제했습니다.')}}};form.onsubmit=async e=>{e.preventDefault();let button=$('#submit');button.disabled=true;button.textContent='저장 중…';try{let f=new FormData(form),regular=Number(f.get('regular')),offer=Number(f.get('offer'));if(offer>regular)throw Error('제안가는 홈페이지 판매가 이하로 입력해 주세요.');if(!String(f.get('name')).trim())throw Error('상품명을 입력해 주세요.');let files=[...form.elements.deliveries.files];if(files.length>3)throw Error('배송사진은 최대 3장까지 등록할 수 있습니다.');let image=form.elements.image.files[0]?await compress(form.elements.image.files[0]):f.has('removeImage')?'':p.image;let deliveries=files.length?await Promise.all(files.map(compress)):f.has('removeDeliveries')?[]:p.deliveries;let updated={id:id||crypto.randomUUID(),name:String(f.get('name')).trim(),category:f.get('category'),size:f.get('size'),description:f.get('description'),regular,offer,notes:f.get('notes'),sample:f.get('sample')==='true',image,deliveries};let d=structuredClone(data);if(old)d.products=d.products.map(x=>x.id===id?updated:x);else d.products.push(updated);if(save(d)){$('#modal').close();render();toast('상품을 저장했습니다.')}}catch(err){toast(err.message)}finally{button.disabled=false;button.textContent='상품 저장'}}}
function noticeField(n){return `<div class="notice-form panel" style="padding:15px"><label class="field">공지 제목<input value="${esc(n.title)}"></label><label class="field">내용<textarea>${esc(n.body)}</textarea></label><button type="button" data-remove style="margin-top:10px">공지 삭제</button></div>`}function settings(){modal('고객 및 공지 설정',`<form id="settingsForm"><div class="form-grid">${field('고객사명','customer',data.customer)}${field('주문 접수 이메일','email',data.email,'email')}${field('카카오톡 채널명','channel',data.channel)}<label class="field full">소개 문구<textarea name="intro">${esc(data.intro)}</textarea></label></div><h3>공지사항</h3><div id="noticeFields">${data.notices.map(noticeField).join('')}</div><button type="button" id="addNotice">＋ 공지 추가</button><p class="helper">편집 내용은 현재 브라우저에 저장됩니다. 다른 기기에서는 백업 파일을 불러오세요. 고객용 파일에는 저장 시점의 정보가 담깁니다.</p><div class="actions"><button class="primary" type="submit">설정 저장</button></div></form>`);$('#addNotice').onclick=()=>$('#noticeFields').insertAdjacentHTML('beforeend',noticeField({title:'',body:''}));$('#noticeFields').onclick=e=>{if(e.target.matches('[data-remove]'))e.target.closest('.notice-form').remove()};$('#settingsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),d=structuredClone(data);for(let k of ['customer','email','channel','intro'])d[k]=String(f.get(k)).trim();if(!d.customer)return toast('고객사명을 입력해 주세요.');d.notices=[...document.querySelectorAll('.notice-form')].map(n=>({title:n.querySelector('input').value.trim(),body:n.querySelector('textarea').value.trim()})).filter(n=>n.title);if(save(d)){$('#modal').close();render();toast('고객 및 공지를 저장했습니다.')}}}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}function excel(){let bytes=Uint8Array.from(atob($('#excel').textContent.trim()),c=>c.charCodeAt(0));download(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'베스트플라워_대량주문양식_샘플.xlsx')}

function exportCustomer(){download(new Blob([customerHTML()],{type:'text/html;charset=utf-8'}),data.customer.replace(/[\\/:*?"<>|]/g,'_')+'_베스트플라워_상품제안.html');toast('고객용 HTML 파일을 저장했습니다.')}
function objectParticle(name){const last=String(name??'').trim().normalize('NFC').slice(-1),code=last.charCodeAt(0);if(code>=0xAC00&&code<=0xD7A3)return (code-0xAC00)%28?'을':'를';if(/[013678]/.test(last)&&last.length)return '을';return '를'}

function area(label,name,value){return `<label class="field full">${label}<textarea name="${name}">${esc(value)}</textarea></label>`}
function orderRow(row){return `<div class="order-row">${field('항목명','fieldLabel',row[0])}${field('작성 안내','fieldBody',row[1])}<button type="button" data-remove-row>삭제</button></div>`}
function editOrder(){if(readonly||preview)return;let o=getOrder();modal('주문 안내 편집',`<form id="orderForm"><div class="form-grid">${field('페이지 제목','title',o.title)}${field('부제목','subtitle',o.subtitle)}</div><h3>주문 단계</h3><p class="helper">{이메일}, {카카오톡}은 고객·공지 설정의 연락처로 자동 표시됩니다.</p>${o.steps.map((x,i)=>`<div class="panel order-step" style="padding:15px">${field((i+1)+'단계 제목','stepTitle',x.title)}${area((i+1)+'단계 설명','stepBody',x.body)}</div>`).join('')}<div class="form-grid">${field('작성 항목 영역 제목','fieldsTitle',o.fieldsTitle)}</div><div id="orderRows">${o.fields.map(orderRow).join('')}</div><button id="addOrderRow" type="button">＋ 작성 항목 추가</button><div class="form-grid" style="margin-top:20px">${area('작성 시 참고사항','fieldNote',o.fieldNote)}${field('결제 안내 제목','paymentTitle',o.paymentTitle)}${area('결제 안내 내용','paymentBody',o.paymentBody)}${area('추가 안내','extra',o.extra)}<label class="field full">엑셀 주문양식 교체 (.xlsx)<input type="file" name="orderFile" accept=".xlsx"><small>현재: ${esc(data.orderFileName||'베스트플라워_대량주문양식_샘플.xlsx')} · 미선택 시 기존 양식 유지 · 최대 2MB</small></label></div><div class="actions"><button type="button" id="cancelOrder">취소</button><button type="submit" class="primary" id="saveOrder">주문 안내 저장</button></div></form>`);$('#cancelOrder').onclick=()=>$('#modal').close();$('#addOrderRow').onclick=()=>$('#orderRows').insertAdjacentHTML('beforeend',orderRow(['','']));$('#orderRows').onclick=e=>{if(e.target.matches('[data-remove-row]'))e.target.closest('.order-row').remove()};$('#orderForm').onsubmit=async e=>{e.preventDefault();const btn=$('#saveOrder');btn.disabled=true;try{let d=structuredClone(data),f=new FormData(e.target),updated={};for(let k of ['title','subtitle','fieldsTitle','fieldNote','paymentTitle','paymentBody','extra'])updated[k]=String(f.get(k)).trim();if(!updated.title)throw Error('페이지 제목을 입력해 주세요.');updated.steps=[...document.querySelectorAll('.order-step')].map(n=>({title:n.querySelector('input').value.trim(),body:n.querySelector('textarea').value.trim()}));updated.fields=[...document.querySelectorAll('.order-row')].map(n=>[...n.querySelectorAll('input')].map(x=>x.value.trim())).filter(x=>x[0]);d.order=updated;const file=e.target.elements.orderFile.files[0];if(file){if(!/\.xlsx$/i.test(file.name)||file.size>2*1024*1024)throw Error('2MB 이하의 .xlsx 파일을 선택해 주세요.');const bytes=new Uint8Array(await file.arrayBuffer());if(bytes[0]!==80||bytes[1]!==75)throw Error('유효한 엑셀 파일인지 확인해 주세요.');d.orderFile=bytesBase64(bytes);d.orderFileName=file.name}if(save(d)){$('#modal').close();tab='order';render();toast('주문 안내를 저장했습니다. 고객 링크에는 다시 발행하면 반영됩니다.')}}catch(err){toast(err.message)}finally{btn.disabled=false}}}
excel=function(){let bytes=Uint8Array.from(atob(data.orderFile||$('#excel').textContent.trim()),c=>c.charCodeAt(0));download(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),data.orderFileName||'베스트플라워_대량주문양식_샘플.xlsx')};
let zoomScale=1;function applyZoom(){const stage=$('#zoomStage'),img=$('#zoomImage');stage.classList.toggle('enlarged',zoomScale>1);img.style.width=zoomScale>1?`${zoomScale*100}%`:'';$('#zoomLevel').textContent=zoomScale===1?'화면 맞춤':Math.round(zoomScale*100)+'%'}function openZoom(src,title){zoomScale=1;$('#zoomImage').src=src;$('#zoomImage').alt=title;$('#lightboxTitle').textContent=title;applyZoom();$('#lightbox').showModal()}$('#zoomIn').onclick=()=>{zoomScale=Math.min(4,zoomScale+.5);applyZoom()};$('#zoomOut').onclick=()=>{zoomScale=Math.max(1,zoomScale-.5);applyZoom()};$('#zoomFit').onclick=()=>{zoomScale=1;applyZoom()};$('#zoomClose').onclick=()=>$('#lightbox').close();$('#lightbox').addEventListener('click',e=>{if(e.target===$('#lightbox'))$('#lightbox').close()});$('#lightbox').addEventListener('close',()=>$('#zoomImage').removeAttribute('src'));$('#editOrderTop').onclick=editOrder;
function bytesBase64(bytes){let parts=[];for(let i=0;i<bytes.length;i+=32768)parts.push(String.fromCharCode(...bytes.subarray(i,i+32768)));return btoa(parts.join(''))}
let githubToken='';const githubRepo='best15993232-sudo/bestflower-proposals';const githubBase='https://best15993232-sudo.github.io/bestflower-proposals/';
function shareKey(){return 'bestflower-link:'+data.customer.trim()}
function githubShare(){if(readonly||preview)return;let slug='';try{slug=localStorage.getItem(shareKey())||''}catch{}if(!slug)slug='proposal-'+crypto.randomUUID().replaceAll('-','').slice(0,16);modal('고객 링크 발행',`<form id="githubForm"><p><b>${esc(data.customer)}</b> 고객용 상품·사진·주문 안내를 GitHub Pages에 발행합니다.</p><p class="helper">발행한 링크는 로그인 없이 열 수 있으며 내용은 공개 저장소에 저장됩니다. 같은 주소로 다시 발행하면 고객은 기존 링크에서 수정본을 볼 수 있습니다.</p><div class="form-grid"><label class="field full">고객 링크 주소<input name="slug" required pattern="[a-z0-9][a-z0-9-]{2,79}" maxlength="80" value="${slug}"><small>${githubBase}p/입력한주소.html · 영문 소문자·숫자·하이픈</small></label><label class="field full">GitHub 발행 토큰<input name="token" type="password" autocomplete="off" spellcheck="false" placeholder="${githubToken?'현재 탭에 연결됨 · 교체할 때만 입력':'선택한 저장소의 Contents 쓰기 권한 토큰'}"><small>토큰은 현재 탭 메모리에서만 사용하며 백업·고객 파일·브라우저 저장소에 저장하지 않습니다.</small></label></div><details style="margin-top:15px"><summary>처음 연결하는 방법</summary><p class="helper">GitHub의 Settings → Developer settings → Personal access tokens → Fine-grained tokens에서 bestflower-proposals 저장소만 선택하고 Contents: Read and write 권한을 지정해 발급하세요. 발급한 토큰은 채팅에 보내지 말고 위 입력칸에 직접 붙여넣으세요. 새로고침 후에는 다시 입력해야 합니다.</p><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">GitHub 토큰 설정 열기 ↗</a></details><div class="actions"><button type="button" id="disconnectGithub">연결 해제</button><button type="submit" class="primary" id="publishGithub">이 내용으로 링크 발행</button></div><p id="shareStatus" role="status" class="share-status helper"></p><div id="shareResult"></div></form>`);$('#disconnectGithub').onclick=()=>{githubToken='';$('#githubForm').elements.token.value='';$('#githubForm').elements.token.placeholder='선택한 저장소의 Contents 쓰기 권한 토큰';toast('현재 탭의 GitHub 연결 정보를 지웠습니다.')};$('#githubForm').onsubmit=publishGithub}
async function githubRequest(path,token,options={}){const r=await fetch('https://api.github.com/repos/'+githubRepo+path,{...options,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(options.body?{'Content-Type':'application/json'}:{})},signal:AbortSignal.timeout(45000)});if(r.status===404&&options.allowMissing)return null;if(!r.ok){const codes={401:'GitHub 토큰이 올바르지 않거나 만료되었습니다.',403:'저장소 Contents 쓰기 권한 또는 API 요청 한도를 확인해 주세요.',404:'저장소 접근 권한이나 GitHub Pages 설정을 확인해 주세요.',409:'다른 변경과 충돌했습니다. 내용을 확인한 뒤 다시 발행해 주세요.',422:'주소나 파일 크기, 저장소 설정을 확인해 주세요.'};throw Error(codes[r.status]||'GitHub 요청 실패 ('+r.status+'). 변경 여부를 저장소에서 확인해 주세요.')}return r.status===204?{}:r.json()}
async function publishGithub(e){e.preventDefault();let form=e.target,btn=$('#publishGithub'),status=$('#shareStatus'),slug=form.elements.slug.value.trim(),token=form.elements.token.value.trim()||githubToken;if(!/^[a-z0-9][a-z0-9-]{2,79}$/.test(slug))return toast('고객 링크 주소를 확인해 주세요.');if(!token)return toast('GitHub 발행 토큰을 입력해 주세요.');btn.disabled=true;status.textContent='GitHub 연결 및 기존 링크를 확인하고 있습니다…';$('#shareResult').innerHTML='';try{const path='/contents/p/'+slug+'.html';const old=await githubRequest(path+'?ref=main',token,{allowMissing:true});if(old&&!confirm('이 주소의 기존 제안서를 현재 내용으로 교체할까요?')){status.textContent='발행을 취소했습니다.';return}const html=customerHTML();if(new Blob([html]).size>20*1024*1024)throw Error('제안서가 20MB를 초과합니다. 사진 수나 크기를 줄여 주세요.');status.textContent='상품과 사진을 발행하고 있습니다. 창을 닫지 말아 주세요…';const payload={message:'Publish customer proposal',branch:'main',content:bytesBase64(new TextEncoder().encode(html)),...(old?{sha:old.sha}:{})};await githubRequest(path,token,{method:'PUT',body:JSON.stringify(payload)});githubToken=token;form.elements.token.value='';form.elements.token.placeholder='현재 탭에 연결됨';try{localStorage.setItem(shareKey(),slug)}catch{}const url=githubBase+'p/'+slug+'.html';status.textContent='GitHub에 저장했습니다. Pages 반영까지 잠시 걸릴 수 있습니다. 링크를 열어 내용이 표시되는지 확인한 후 전달하세요.';$('#shareResult').innerHTML=`<a class="result-link" href="${url}" target="_blank" rel="noopener noreferrer">${url}</a><button type="button" id="copyCustomerLink" style="margin-top:12px">고객 링크 복사</button>`;$('#copyCustomerLink').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('고객 링크를 복사했습니다.')}catch{toast('위 링크를 길게 누르거나 우클릭해 복사해 주세요.')}}}catch(err){status.textContent=err.name==='TimeoutError'||err.name==='TypeError'?'연결이 끊겼습니다. GitHub에 저장되었을 수 있으므로 저장소에서 반영 여부를 확인한 뒤 다시 시도해 주세요.':err.message}finally{btn.disabled=false}}
$('#shareGithub').onclick=githubShare;

$('#art').innerHTML=art()+'<small>FLOWERS FOR EVERY MILESTONE</small>';$('#downloadTop').onclick=excel;$('#explore').onclick=()=>{tab='products';render();$('.tabs').scrollIntoView({behavior:'smooth'})};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#close').onclick=()=>$('#modal').close();$('#settings').onclick=settings;$('#add').onclick=()=>edit();$('#preview').onclick=()=>{preview=true;render()};$('#exitPreview').onclick=()=>{preview=false;render()};$('#export').onclick=exportCustomer;$('#backup').onclick=()=>download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'베스트플라워_편집백업.json');$('#restore').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>25*1024*1024)throw Error('백업 파일은 25MB 이하만 지원합니다.');let d=validate(JSON.parse(await f.text()));if(confirm('현재 내용을 백업 파일의 내용으로 교체할까요?')&&save(d)){render();toast('백업을 불러왔습니다.')}}catch(err){toast(err.message)}finally{e.target.value=''}};render();
</script></body></html>
